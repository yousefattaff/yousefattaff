<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Hello world! I am Yousef, an AI engineer and a mechatronics graduate.</title>
  <desc id="description">A simple R2-D2 peeks into a dark panel from the left. Mint monospace text introduces Yousef as an AI engineer and mechatronics graduate, surrounded by blue.</desc>
  <defs>
    <linearGradient id="background" x1="600" y1="0" x2="600" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4B94DF"/>
      <stop offset="1" stop-color="#3D80C5"/>
    </linearGradient>
    <filter id="shadow" x="20" y="35" width="1160" height="410" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="15" stdDeviation="19" flood-color="#082C50" flood-opacity="0.48"/>
    </filter>
    <clipPath id="panel">
      <rect x="80" y="80" width="1040" height="320" rx="5"/>
    </clipPath>
  </defs>

  <rect width="1200" height="480" fill="url(#background)"/>
  <rect x="80" y="80" width="1040" height="320" rx="5" fill="#001522" stroke="#0A2033" stroke-width="2" filter="url(#shadow)"/>

  <g clip-path="url(#panel)">
    <g transform="translate(13 117) rotate(7 90 135)">
      <!-- Flat shapes keep the droid readable at profile-banner size. -->
      <path d="M20 88A62 62 0 0 1 144 88V99H20Z" fill="#D9E3EC"/>
      <path d="M70 27A62 62 0 0 1 104 30L106 52H70Z" fill="#387DC7"/>
      <path d="M117 39A62 62 0 0 1 141 69H119Z" fill="#387DC7"/>
      <path d="M20 84H144V99H20Z" fill="#387DC7"/>
      <rect x="77" y="54" width="32" height="26" rx="4" fill="#2767AC"/>
      <circle cx="93" cy="67" r="9" fill="#001522"/>
      <circle cx="96" cy="64" r="2" fill="#ABC5D8"/>
      <rect x="117" y="76" width="12" height="6" rx="2" fill="#6D879C"/>
      <circle cx="123" cy="79" r="2.5" fill="#EA8179"/>

      <rect x="21" y="103" width="122" height="137" rx="10" fill="#EDF2F5"/>
      <rect x="21" y="103" width="122" height="9" fill="#BCCBD6"/>
      <rect x="49" y="121" width="61" height="12" rx="2" fill="#387DC7"/>
      <rect x="49" y="141" width="61" height="12" rx="2" fill="#387DC7"/>
      <rect x="78" y="168" width="29" height="51" rx="3" fill="#387DC7"/>
      <path d="M84 178H101M84 188H101M84 198H101M84 208H101" stroke="#BDD7EA" stroke-width="3"/>
      <rect x="117" y="124" width="13" height="94" rx="2" fill="#C1CFDA"/>
      <path d="M123.5 132V210" stroke="#859BAC" stroke-width="3"/>
      <rect x="38" y="169" width="26" height="49" rx="3" fill="#CFDAE2"/>
      <path d="M45 178H57M45 189H57M45 200H57" stroke="#8BA3B5" stroke-width="3"/>

      <rect x="144" y="125" width="22" height="107" rx="7" fill="#DDE6EC"/>
      <rect x="149" y="158" width="12" height="62" rx="2" fill="#387DC7"/>
      <path d="M139 230H169L179 250H129Z" fill="#EDF2F5"/>
      <path d="M139 247H172" stroke="#C1CFDA" stroke-width="6"/>
      <rect x="74" y="237" width="19" height="14" fill="#BCCBD6"/>
      <path d="M67 251H101L107 265H61Z" fill="#E5ECF1"/>
    </g>
  </g>

  <g text-anchor="middle" fill="#94D7C5" font-family="Consolas, Courier New, monospace">
    <text x="600" y="204" font-size="32" letter-spacing="1">Hello world!</text>
    <text x="600" y="254" font-size="25">I am Yousef, an AI engineer</text>
    <text x="600" y="292" font-size="25">and a mechatronics graduate.</text>
  </g>
</svg>
